name: CI
permissions: { contents: read }
on:
  pull_request:
  push: { branches: [main] }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: "1.23.x", cache: false }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check
      - run: npm run build
      - run: docker compose config --quiet
      - run: docker build -t citewise-review:ci .
      - run: npm audit --audit-level=high
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_DB: review, POSTGRES_USER: review, POSTGRES_PASSWORD: review }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U review -d review"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env: { DATABASE_URL: "postgresql://review:review@localhost:5432/review?schema=public" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
