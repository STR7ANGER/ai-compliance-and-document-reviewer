services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_DB: review, POSTGRES_USER: review, POSTGRES_PASSWORD: review }
    ports: ["5470:5432"]
    volumes: ["review-postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U review -d review"], interval: 3s, timeout: 3s, retries: 20 }
  mongodb:
    image: mongo:8
    environment: { MONGO_INITDB_ROOT_USERNAME: review, MONGO_INITDB_ROOT_PASSWORD: review }
    ports: ["27070:27017"]
    volumes: ["review-mongo:/data/db"]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:8-alpine
    ports: ["6410:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: review, MINIO_ROOT_PASSWORD: replace-with-minimum-16-character-secret }
    ports: ["9010:9000", "9011:9001"]
    volumes: ["review-objects:/data"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 5s, retries: 20 }
volumes:
  review-postgres:
  review-mongo:
  review-objects:
